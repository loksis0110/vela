<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Vela</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="shell" id="shell">

  <main class="home" id="home">
    <header class="topbar">
      <div class="brand">
        <img src="icon.png" alt="" width="28" height="28">
        <span>Vela</span>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="openConnections" data-i18n-title="conn.title" data-i18n-aria="conn.title">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h13"/><path d="m14 4 3 3-3 3"/><path d="M20 17H7"/><path d="m10 14-3 3 3 3"/></svg>
        </button>
        <button class="icon-btn" id="openStats" data-i18n-title="stats.title" data-i18n-aria="stats.title">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11"/><path d="M10 20V5"/><path d="M15 20v-7"/><path d="M20 20V8"/></svg>
        </button>
        <button class="icon-btn" id="openSettings" data-i18n-title="settings.title" data-i18n-aria="settings.title">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 13.5a7.7 7.7 0 0 0 0-3l2-1.5-2-3.5-2.4 1a7.6 7.6 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.5A7.6 7.6 0 0 0 7 6.5l-2.4-1-2 3.5 2 1.5a7.7 7.7 0 0 0 0 3l-2 1.5 2 3.5 2.4-1a7.6 7.6 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.6 7.6 0 0 0 2.6-1.5l2.4 1 2-3.5-2-1.5Z"/></svg>
        </button>
      </div>
    </header>

    <section class="hero" id="hero" data-state="disconnected">
      <button class="sky" id="toggle" aria-live="polite">
        <svg class="constellation" viewBox="0 0 260 260" aria-hidden="true">
          <defs>
            <radialGradient id="halo" cx="50%" cy="50%" r="50%">
              <stop offset="0" stop-color="var(--glow)" stop-opacity=".35"/>
              <stop offset="1" stop-color="var(--glow)" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <circle class="halo" cx="130" cy="130" r="128" fill="url(#halo)"/>
          <circle class="orbit" cx="130" cy="130" r="118"/>
          <polygon class="sail" points="128,42 128,176 196,160"/>
          <g class="lines">
            <line x1="128" y1="42" x2="128" y2="176" style="--i:0"/>
            <line x1="128" y1="42" x2="196" y2="160" style="--i:1"/>
            <line x1="196" y1="160" x2="128" y2="176" style="--i:2"/>
            <line x1="128" y1="176" x2="70" y2="188" style="--i:3"/>
            <line x1="128" y1="176" x2="186" y2="190" style="--i:4"/>
            <line x1="128" y1="42" x2="92" y2="96" style="--i:5"/>
          </g>
          <g class="stars">
            <path d="M128 30l3 9 9 3-9 3-3 9-3-9-9-3 9-3z"/>
            <path d="M128 165l2.6 8 8 2.6-8 2.6-2.6 8-2.6-8-8-2.6 8-2.6z"/>
            <path d="M196 150l2.4 7.4 7.4 2.4-7.4 2.4-2.4 7.4-2.4-7.4-7.4-2.4 7.4-2.4z"/>
            <circle cx="70" cy="188" r="3.6"/>
            <circle cx="186" cy="190" r="3.2"/>
            <circle cx="92" cy="96" r="3"/>
            <circle class="far" cx="56" cy="62" r="1.4"/>
            <circle class="far" cx="212" cy="74" r="1.2"/>
            <circle class="far" cx="44" cy="140" r="1.1"/>
            <circle class="far" cx="214" cy="214" r="1.3"/>
          </g>
        </svg>
        <span class="sky-label" id="toggleLabel"></span>
      </button>
      <p class="status"><span class="ks-mark" id="ksMark" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 4.5 3 8.3 7 10 4-1.7 7-5.5 7-10V6l-7-3Z"/><path d="m9 12 2 2 4-4"/></svg></span><span id="statusText"></span></p>
      <p class="timer" id="timer"></p>
      <div class="speed" id="speed" hidden>
        <div><span class="arrow">↓</span><b id="down"></b></div>
        <div><span class="arrow">↑</span><b id="up"></b></div>
      </div>
      <figure class="graph" id="graphBox" hidden>
        <canvas id="graph" height="64" data-i18n-aria="home.graph"></canvas>
        <figcaption><span class="key down" data-i18n="common.download"></span><span class="key up" data-i18n="common.upload"></span><span id="graphPeak"></span></figcaption>
      </figure>
    </section>

    <div class="banner danger ks" id="ksBanner" role="alert" hidden>
      <svg class="banner-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 4.5 3 8.3 7 10 4-1.7 7-5.5 7-10V6l-7-3Z"/><path d="M12 8v5"/><path d="M12 16.5v.5"/></svg>
      <div class="banner-body">
        <b data-i18n="ks.blocked"></b>
        <span id="ksBannerText" data-i18n="ks.blockedText"></span>
        <div class="banner-actions">
          <button class="btn small" id="ksReconnect" data-i18n="ks.reconnect"></button>
          <button class="btn ghost small" id="ksOff" data-i18n="ks.turnOff"></button>
        </div>
      </div>
    </div>

    <div class="banner" id="banner" hidden>
      <p id="bannerText"></p>
      <button class="btn small" id="bannerAction" hidden></button>
    </div>

    <div class="notices" id="notices"></div>

    <section class="panel-home">
      <div class="tools-row">
        <button class="tool" id="ipCard">
          <span class="tool-label" data-i18n="ip.label"></span>
          <span class="tool-value" id="ipValue" data-i18n="ip.find"></span>
          <span class="tool-meta" id="ipMeta" data-i18n="ip.meta"></span>
        </button>
        <button class="tool" id="speedCard">
          <span class="tool-label" data-i18n="speed.label"></span>
          <span class="tool-value" id="speedValue" data-i18n="speed.measure"></span>
          <span class="tool-meta" id="speedMeta" data-i18n="speed.meta"></span>
        </button>
      </div>
      <button class="current" id="currentServer">
        <span class="current-flag" id="curFlag">✦</span>
        <span class="current-body">
          <span class="current-name" id="curName"></span>
          <span class="current-meta" id="curMeta"></span>
        </span>
        <span class="chev" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></span>
      </button>

      <div class="routing-box">
        <div class="routing" role="radiogroup" data-i18n-aria="routing.aria">
          <button role="radio" data-routing="smart" aria-checked="false"><b data-i18n="routing.smart.short"></b></button>
          <button role="radio" data-routing="global" aria-checked="false"><b data-i18n="routing.global.short"></b></button>
          <button role="radio" data-routing="blocked" aria-checked="false"><b data-i18n="routing.blocked.short"></b></button>
        </div>
        <p class="routing-hint" id="routingHint"></p>
      </div>
    </section>
  </main>

  <!-- Servers -->
  <aside class="sheet" id="servers" data-i18n-aria="servers.title" hidden>
    <header class="sheet-head">
      <button class="icon-btn back" data-close data-i18n-aria="common.back"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
      <h2 data-i18n="servers.title"></h2>
      <div class="sheet-actions">
        <button class="icon-btn" id="refreshSub" data-i18n-title="servers.refresh" data-i18n-aria="servers.refresh"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.6-4.5L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.6 4.5L20 16"/><path d="M20 20v-4h-4"/></svg></button>
        <button class="icon-btn" id="pingAll"><svg viewBox="0 0 24 24"><path d="M4 16a8 8 0 1 1 16 0"/><path d="m12 16 4-6"/></svg></button>
        <button class="btn small" id="openAdd" data-i18n="common.add"></button>
      </div>
    </header>
    <nav class="tabs" id="profileTabs" data-i18n-aria="servers.subs"></nav>
    <div class="profile-info" id="profileInfo"></div>
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      <input id="search" type="search" data-i18n-placeholder="servers.search" spellcheck="false" autocomplete="off">
    </div>
    <div class="list-tools" id="filters">
      <button class="chip" data-filter="fav" aria-pressed="false" data-i18n="servers.fav"></button>
      <button class="chip" data-filter="ok" aria-pressed="false" data-i18n="servers.working"></button>
      <select class="chip select" id="protoFilter" data-i18n-aria="servers.protocol"></select>
      <select class="chip select" id="countryFilter" data-i18n-aria="servers.country"></select>
      <button class="chip" id="sortToggle" aria-pressed="false" data-i18n="servers.fastFirst"></button>
      <button class="chip" id="openReport" data-i18n="servers.report" data-i18n-title="servers.reportHint"></button>
    </div>
    <p class="list-count" id="listCount"></p>
    <div class="probe" id="probeBar" hidden>
      <div class="probe-head"><span id="probeText"></span><button type="button" class="link-btn" id="probeStop" data-i18n="servers.stop"></button></div>
      <div class="bar"><i id="probeFill"></i></div>
    </div>
    <ul class="nodes" id="nodeList"></ul>
  </aside>

  <!-- Statistics -->
  <aside class="sheet" id="stats" data-i18n-aria="stats.title" hidden>
    <header class="sheet-head">
      <button class="icon-btn back" data-close data-i18n-aria="common.back"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
      <h2 data-i18n="stats.title"></h2>
    </header>
    <div class="sheet-scroll">
      <div class="sheet-inner">
        <div class="stat-cards">
          <div class="stat-card"><span class="stat-label" data-i18n="stats.today"></span><b id="stToday">–</b><span class="stat-sub" id="stTodaySub"></span></div>
          <div class="stat-card"><span class="stat-label" data-i18n="stats.month"></span><b id="stMonth">–</b><span class="stat-sub" id="stMonthSub"></span></div>
          <div class="stat-card"><span class="stat-label" data-i18n="stats.total"></span><b id="stTotal">–</b><span class="stat-sub" id="stTotalSub"></span></div>
        </div>
        <section class="card chart-card">
          <div class="card-head">
            <h3 data-i18n="stats.days"></h3>
            <div class="legend"><span class="key down" data-i18n="common.download"></span><span class="key up" data-i18n="common.upload"></span></div>
          </div>
          <div class="chart" id="dayChart"></div>
          <div class="chart-tip" id="chartTip" hidden></div>
        </section>
        <section class="card">
          <div class="card-head"><h3 data-i18n="stats.months"></h3></div>
          <ul class="months" id="monthList"></ul>
        </section>
        <p class="hint center" data-i18n="stats.note"></p>
      </div>
    </div>
  </aside>

  <!-- Active connections -->
  <aside class="sheet" id="connections" data-i18n-aria="conn.title" hidden>
    <header class="sheet-head">
      <button class="icon-btn back" data-close data-i18n-aria="common.back"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
      <h2 data-i18n="conn.title"></h2>
      <div class="sheet-actions">
        <button class="btn ghost small" id="closeAll" data-i18n="conn.closeAll" hidden></button>
      </div>
    </header>
    <div class="conn-tools" id="connTools" hidden>
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        <input id="connSearch" type="search" data-i18n-placeholder="conn.search" spellcheck="false" autocomplete="off">
      </div>
      <p class="list-count" id="connSummary"></p>
    </div>
    <ul class="conns" id="connList"></ul>
  </aside>

  <!-- Settings -->
  <aside class="sheet" id="settings" data-i18n-aria="settings.title" hidden>
    <header class="sheet-head">
      <button class="icon-btn back" data-close data-i18n-aria="common.back"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
      <h2 data-i18n="settings.title"></h2>
    </header>
    <form class="settings" id="settingsForm">
      <div class="sheet-inner">
      <fieldset>
        <legend data-i18n="settings.connection"></legend>
        <label class="choice"><input type="radio" name="mode" value="tun"><span><b data-i18n="mode.tun"></b><em data-i18n="mode.tunHint"></em></span></label>
        <label class="choice"><input type="radio" name="mode" value="proxy"><span><b data-i18n="mode.proxy"></b><em data-i18n="mode.proxyHint"></em></span></label>
        <label class="choice"><input type="radio" name="mode" value="local"><span><b data-i18n="mode.local"></b><em data-i18n="mode.localHint"></em></span></label>
        <label class="switch"><span><b data-i18n="settings.connectOnLaunch"></b></span><input type="checkbox" name="connectOnLaunch"><i></i></label>
        <label class="switch"><span><b data-i18n="settings.failover"></b><em data-i18n="settings.failoverHint"></em></span><input type="checkbox" name="failover"><i></i></label>
      </fieldset>
      <fieldset id="ksPrefs">
        <legend data-i18n="ks.legend"></legend>
        <label class="switch" id="ksRow"><span><b data-i18n="ks.setting"></b><em data-i18n="ks.settingHint"></em></span><input type="checkbox" data-pref="killSwitch"><i></i></label>
        <label class="switch sub" id="ksLanRow"><span><b data-i18n="ks.lan"></b><em data-i18n="ks.lanHint"></em></span><input type="checkbox" data-pref="killSwitchLan"><i></i></label>
        <div class="hint-row" id="ksHint" hidden><span id="ksHintText"></span><button type="button" class="btn ghost small" id="ksElevate" data-i18n="ks.restartAdmin" hidden></button></div>
      </fieldset>
      <fieldset>
        <legend data-i18n="settings.routing"></legend>
        <label class="choice"><input type="radio" name="routing" value="smart"><span><b data-i18n="routing.smart"></b><em data-i18n="routing.smart.hint"></em></span></label>
        <label class="choice"><input type="radio" name="routing" value="global"><span><b data-i18n="routing.global"></b><em data-i18n="routing.global.hint"></em></span></label>
        <label class="choice"><input type="radio" name="routing" value="blocked"><span><b data-i18n="routing.blocked"></b><em data-i18n="routing.blocked.hint"></em></span></label>
      </fieldset>
      <fieldset id="looks">
        <legend data-i18n="settings.looks"></legend>
        <span class="field-label" data-i18n="settings.theme"></span>
        <div class="segmented" role="radiogroup" data-i18n-aria="settings.theme">
          <label><input type="radio" name="theme" value="system"><span data-i18n="theme.system"></span></label>
          <label><input type="radio" name="theme" value="light"><span data-i18n="theme.light"></span></label>
          <label><input type="radio" name="theme" value="dark"><span data-i18n="theme.dark"></span></label>
        </div>
        <span class="field-label" data-i18n="settings.language"></span>
        <div class="segmented" role="radiogroup" data-i18n-aria="settings.language">
          <label><input type="radio" name="language" value=""><span data-i18n="lang.system"></span></label>
          <label><input type="radio" name="language" value="ru"><span>Русский</span></label>
          <label><input type="radio" name="language" value="en"><span>English</span></label>
        </div>
      </fieldset>
      <fieldset id="appPrefs">
        <legend data-i18n="settings.app"></legend>
        <label class="switch"><span><b data-i18n="upd.auto"></b><em data-i18n="upd.autoHint"></em></span><input type="checkbox" data-pref="updates"><i></i></label>
        <div class="line-row">
          <span class="line-text"><b data-i18n="upd.version"></b><em id="updStatus"></em></span>
          <button type="button" class="btn ghost small" id="checkUpdate" data-i18n="upd.check"></button>
        </div>
        <div class="line-row">
          <span class="line-text"><b data-i18n="hotkey.title"></b><em id="hotkeyHint" data-i18n="hotkey.hint"></em></span>
          <span class="hotkey-ctl">
            <button type="button" class="kbd" id="hotkeyBtn" data-i18n-title="hotkey.change"></button>
            <button type="button" class="link-btn" id="hotkeyOff"></button>
          </span>
        </div>
        <p class="hint error" id="hotkeyError" hidden></p>
        <label class="switch"><span><b data-i18n="clip.setting"></b><em data-i18n="clip.settingHint"></em></span><input type="checkbox" data-pref="clipboard"><i></i></label>
      </fieldset>
      <fieldset>
        <legend data-i18n="split.legend"></legend>
        <label class="field"><span data-i18n="split.which"></span>
          <select name="appMode">
            <option value="" data-i18n="split.all"></option>
            <option value="exclude" data-i18n="split.exclude"></option>
            <option value="only" data-i18n="split.only"></option>
          </select></label>
        <div class="apps" id="appsBox">
          <div class="app-chips" id="appChips" data-empty=""></div>
          <div class="row-btns">
            <button type="button" class="btn ghost small" id="pickApps" data-i18n="split.pick"></button>
            <input class="text-input small" id="appInput" data-i18n-placeholder="split.namePlaceholder" spellcheck="false">
            <button type="button" class="btn ghost small" id="addApp" data-i18n="common.add"></button>
          </div>
          <p class="hint" data-i18n="split.hint"></p>
        </div>
      </fieldset>
      <fieldset id="subPrefs">
        <legend data-i18n="subs.legend"></legend>
        <label class="switch"><span><b data-i18n="subs.auto"></b><em data-i18n="subs.autoHint"></em></span><input type="checkbox" data-sub="autoUpdate"><i></i></label>
        <label class="field"><span data-i18n="subs.often"></span>
          <select data-sub="updateHours">
            <option value="0" data-i18n="subs.provider"></option>
            <option value="1" data-i18n="subs.h1"></option>
            <option value="3" data-i18n="subs.h3"></option>
            <option value="6" data-i18n="subs.h6"></option>
            <option value="12" data-i18n="subs.h12"></option>
            <option value="24" data-i18n="subs.h24"></option>
          </select>
        </label>
        <label class="switch"><span><b data-i18n="subs.hwid"></b><em data-i18n="subs.hwidHint"></em></span><input type="checkbox" data-sub="hwid"><i></i></label>
        <label class="field"><span>User-Agent</span><input type="text" data-sub="userAgent" data-i18n-placeholder="subs.uaPlaceholder" spellcheck="false" autocomplete="off"></label>
        <p class="hint" data-i18n="subs.uaHint"></p>
      </fieldset>
      <fieldset>
        <legend data-i18n="backup.legend"></legend>
        <p class="hint" data-i18n="backup.hint"></p>
        <div class="row-btns">
          <button type="button" class="btn ghost small" id="exportBtn" data-i18n="backup.export"></button>
          <button type="button" class="btn ghost small" id="importBtn" data-i18n="backup.import"></button>
        </div>
      </fieldset>
      <fieldset>
        <legend data-i18n="filters.legend"></legend>
        <label class="switch"><span><b data-i18n="filters.ads"></b><em data-i18n="filters.adsHint"></em></span><input type="checkbox" name="blockAds"><i></i></label>
        <label class="switch"><span><b>IPv6</b><em data-i18n="filters.ipv6Hint"></em></span><input type="checkbox" name="ipv6"><i></i></label>
        <label class="field"><span data-i18n="filters.direct"></span><textarea name="directDomains" rows="2" placeholder="gosuslugi.ru, sberbank.ru"></textarea></label>
        <label class="field"><span data-i18n="filters.proxy"></span><textarea name="proxyDomains" rows="2" placeholder="youtube.com, chatgpt.com"></textarea></label>
      </fieldset>
      <details>
        <summary data-i18n="adv.legend"></summary>
        <label class="field"><span data-i18n="adv.remoteDns"></span><input name="remoteDns" spellcheck="false"></label>
        <label class="field"><span data-i18n="adv.directDns"></span><input name="directDns" spellcheck="false"></label>
        <label class="field"><span data-i18n="adv.stack"></span>
          <select name="stack"><option value="mixed" data-i18n="adv.stackMixed"></option><option value="system" data-i18n="adv.stackSystem"></option><option value="gvisor" data-i18n="adv.stackGvisor"></option></select></label>
        <label class="field"><span data-i18n="adv.port"></span><input name="proxyPort" type="number" min="1024" max="65535"></label>
        <label class="switch"><span><b data-i18n="adv.lan"></b><em data-i18n="adv.lanHint"></em></span><input type="checkbox" name="allowLan"><i></i></label>
        <label class="field"><span data-i18n="adv.fragment"></span>
          <select name="tlsFragment">
            <option value="" data-i18n="adv.fragmentOff"></option>
            <option value="record" data-i18n="adv.fragmentLight"></option>
            <option value="full" data-i18n="adv.fragmentFull"></option>
          </select></label>
        <div class="field">
          <span data-i18n="adv.rules"></span>
          <p class="hint" data-i18n="adv.rulesHint"></p>
          <ul class="rules" id="rulesList"></ul>
          <button type="button" class="btn ghost small" id="addRule" data-i18n="adv.addRule"></button>
        </div>
        <div class="row-btns">
          <button type="button" class="btn ghost small" id="showLogs" data-i18n="adv.showLogs"></button>
        </div>
      </details>
      <fieldset class="about">
        <legend data-i18n="about.legend"></legend>
        <p id="aboutText"></p>
        <div class="row-btns">
          <button type="button" class="btn ghost small" data-open="logs" data-i18n="about.logs"></button>
          <button type="button" class="btn ghost small" data-open="privacy" data-i18n="about.privacy"></button>
          <button type="button" class="btn ghost small" id="resetSettings" data-i18n="about.reset"></button>
          <button type="button" class="btn danger small" id="quit" data-i18n="about.quit"></button>
        </div>
      </fieldset>
      </div>
    </form>
  </aside>

  <!-- Add dialog -->
  <dialog class="dialog" id="addDialog">
    <form method="dialog" id="addForm">
      <h3 data-i18n="add.title"></h3>
      <p class="hint" data-i18n="add.hint"></p>
      <textarea id="addText" rows="5" spellcheck="false"></textarea>
      <div class="drop" id="qrDrop">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4z"/><path d="M14 14h2v2h-2zM18 14h2v2M14 18h2M18 18h2v2h-2"/></svg>
        <span><span data-i18n="add.qr"></span> <button type="button" class="link-inline" id="qrPick" data-i18n="add.qrPick"></button></span>
        <input type="file" id="qrFile" accept="image/*" hidden>
      </div>
      <p class="form-error" id="addError" hidden></p>
      <div class="dialog-btns">
        <button type="button" class="btn ghost" id="pasteBtn" data-i18n="add.paste"></button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" value="cancel" id="addCancel" data-i18n="common.cancel"></button>
        <button type="submit" class="btn" id="addSubmit" data-i18n="common.add"></button>
      </div>
    </form>
  </dialog>

  <!-- App link: confirm what will be added -->
  <dialog class="dialog" id="offerDialog">
    <form id="offerForm">
      <h3 id="offerTitle"></h3>
      <div class="offer" id="offerBody"></div>
      <p class="form-error" id="offerError" hidden></p>
      <div class="dialog-btns">
        <span class="spacer"></span>
        <button type="button" class="btn ghost" id="offerCancel" data-i18n="common.cancel"></button>
        <button type="submit" class="btn" id="offerAdd" data-i18n="common.add"></button>
      </div>
    </form>
  </dialog>

  <dialog class="dialog" id="renameDialog">
    <form id="renameForm">
      <h3 data-i18n="rename.title"></h3>
      <p class="hint" data-i18n="rename.hint"></p>
      <input id="renameText" class="text-input" maxlength="60" spellcheck="false">
      <div class="dialog-btns">
        <span class="spacer"></span>
        <button type="button" class="btn ghost" id="renameCancel" data-i18n="common.cancel"></button>
        <button type="submit" class="btn" data-i18n="common.save"></button>
      </div>
    </form>
  </dialog>

  <dialog class="dialog" id="shareDialog">
    <form method="dialog">
      <h3 id="shareTitle"></h3>
      <p class="hint" id="shareHint"></p>
      <img class="qr" id="shareQR" data-i18n-alt="share.qrAlt" width="260" height="260">
      <textarea id="shareText" rows="3" readonly spellcheck="false"></textarea>
      <div class="dialog-btns">
        <button type="button" class="btn ghost" id="shareCopy" data-i18n="common.copy"></button>
        <span class="spacer"></span>
        <button class="btn" data-i18n="common.done"></button>
      </div>
    </form>
  </dialog>

  <dialog class="dialog" id="appsDialog">
    <form id="appsForm">
      <h3 data-i18n="split.running"></h3>
      <input class="text-input" id="appsFilter" data-i18n-placeholder="common.search" spellcheck="false">
      <ul class="pick-list" id="appsList"></ul>
      <div class="dialog-btns">
        <span class="spacer"></span>
        <button type="button" class="btn ghost" id="appsCancel" data-i18n="common.cancel"></button>
        <button type="submit" class="btn" data-i18n="common.done"></button>
      </div>
    </form>
  </dialog>

  <dialog class="dialog wide" id="logsDialog">
    <form method="dialog">
      <h3 data-i18n="logs.title"></h3>
      <pre class="logs" id="logsText"></pre>
      <div class="dialog-btns">
        <button type="button" class="btn ghost" id="logsRefresh" data-i18n="logs.refresh"></button>
        <button type="button" class="btn ghost" data-open="logs" data-i18n="logs.folder"></button>
        <span class="spacer"></span>
        <button class="btn" data-i18n="common.close"></button>
      </div>
    </form>
  </dialog>

  <dialog class="dialog" id="privacyDialog">
    <form method="dialog">
      <h3 data-i18n="about.privacy"></h3>
      <p data-i18n="privacy.p1"></p>
      <p data-i18n="privacy.p2"></p>
      <div class="dialog-btns"><span class="spacer"></span><button class="btn" data-i18n="common.ok"></button></div>
    </form>
  </dialog>

  <div class="overlay" id="restartOverlay" hidden>
    <div class="overlay-box"><span class="spinner" aria-hidden="true"></span><p data-i18n="upd.restarting"></p></div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>
</div>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
