# Generate the Xcode project with XcodeGen:  brew install xcodegen && xcodegen
name: Vela
options:
  bundleIdPrefix: app.vela
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    # Put your Apple Developer Team ID here (or pass DEVELOPMENT_TEAM=... to xcodebuild)
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "6"
    SWIFT_VERSION: "5.9"
    APP_GROUP_IDENTIFIER: group.app.vela.client
    ENABLE_BITCODE: NO
    CODE_SIGN_STYLE: Automatic
targets:
  Vela:
    type: application
    scheme: {}
    platform: iOS
    sources:
      - path: Vela
    resources:
      - path: Vela/Assets.xcassets
    dependencies:
      - target: VelaTunnel
        embed: true
      - target: VelaWidgets
        embed: true
      - framework: Frameworks/Velacore.xcframework
        embed: false
      - sdk: NetworkExtension.framework
      - sdk: WidgetKit.framework
      - sdk: libresolv.tbd
    entitlements:
      path: Vela/Vela.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [$(APP_GROUP_IDENTIFIER)]
    info:
      path: Vela/Info.plist
      properties:
        CFBundleDisplayName: Vela
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Камера нужна, чтобы отсканировать QR-код подписки или сервера.
        ITSAppUsesNonExemptEncryption: true
        AppGroupIdentifier: $(APP_GROUP_IDENTIFIER)
        CFBundleURLTypes:
          - CFBundleURLName: app.vela.client.links
            CFBundleURLSchemes: [vela, vless, vmess, trojan, ss, hysteria2, hy2, tuic]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vela.client
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        OTHER_LDFLAGS: ["-lresolv"]
  VelaTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: VelaTunnel
      # rule sets for the smart mode, copied into the extension bundle
      - path: ../core/rules
        buildPhase: resources
    dependencies:
      - framework: Frameworks/Libbox.xcframework
        embed: false
      - sdk: NetworkExtension.framework
      - sdk: libresolv.tbd
    entitlements:
      path: VelaTunnel/VelaTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [$(APP_GROUP_IDENTIFIER)]
    info:
      path: VelaTunnel/Info.plist
      properties:
        CFBundleDisplayName: Vela Tunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupIdentifier: $(APP_GROUP_IDENTIFIER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vela.client.tunnel
        OTHER_LDFLAGS: ["-lresolv"]
        TARGETED_DEVICE_FAMILY: "1,2"
  VelaWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: VelaWidgets
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
      - sdk: NetworkExtension.framework
    entitlements:
      path: VelaWidgets/VelaWidgets.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [$(APP_GROUP_IDENTIFIER)]
    info:
      path: VelaWidgets/Info.plist
      properties:
        CFBundleDisplayName: Vela
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vela.client.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
