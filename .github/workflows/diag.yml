name: Diagnose

# Manual check of a subscription: every server with the Vela core and with
# Xray-core, from a GitHub runner. Results are annotations (no keys).
on:
  workflow_dispatch:
    inputs:
      sub:
        description: Subscription URL
        required: true
      ua:
        description: User-Agent (optional)
        required: false

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Subscription headers
        env:
          SUB_URL: ${{ inputs.sub }}
        run: |
          for ua in "Happ/3.10.0/ios" "v2rayNG/1.10.20" "Vela/1.3 (v2rayN-compatible)" "clash-verge/v2.2.3" "sing-box 1.14.2"; do
            curl -sS -o body.txt -D headers.txt -A "$ua" "$SUB_URL" || true
            h=$(grep -iv '^set-cookie\|^cf-\|^report-to\|^nel\|^date\|^server:\|^alt-svc' headers.txt | tr -d '\r' | sed 's/%/%25/g' | awk 'NF' | paste -sd '|' -)
            b="$(wc -c < body.txt) bytes, starts: $(head -c 24 body.txt | tr -c '[:alnum:]:/{}[]-' '.')"
            echo "::notice title=UA $ua::$h || body $b"
          done
      - name: Prepare core
        run: ./scripts/prepare-core.sh && go mod tidy
      - name: Vela check
        env:
          SUB_URL: ${{ inputs.sub }}
          SUB_UA: ${{ inputs.ua }}
        run: go run -tags "with_gvisor,with_quic,with_utls,with_clash_api" ./tools/diag
      - name: Xray check
        run: |
          curl -sSL -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -q -o xray.zip xray -d xr
          ./xr/xray version | head -1
          python3 tools/diag/xray.py ./xr/xray
      - name: Hysteria2 check
        if: always()
        run: |
          curl -sSL -o hysteria https://github.com/apernet/hysteria/releases/latest/download/hysteria-linux-amd64
          chmod +x hysteria
          ./hysteria version | head -3 || true
          python3 tools/diag/hy2.py ./hysteria
