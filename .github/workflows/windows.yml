name: Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: make test

  windows:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: make windows
      - uses: actions/upload-artifact@v4
        with:
          name: Vela-windows
          path: dist/Vela.exe

      - name: Publish to the "latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create latest --title "Vela (последняя сборка)" --notes "Готовые сборки Vela. Android: файл .apk. iPhone: Vela-unsigned.ipa, подпишите своим сертификатом." --prerelease 2>/dev/null || true
          gh release upload latest dist/Vela.exe --clobber
