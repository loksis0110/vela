name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: make test

  android:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift \
            /usr/local/lib/android/sdk/ndk /opt/microsoft /opt/google/chrome
          df -h /
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28
      - name: Build core library
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -o pipefail
          ./scripts/build-mobile-libs.sh android 2>&1 | tee $RUNNER_TEMP/lib.log
      - name: Build APK and App Bundle
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          VELA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VELA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VELA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Without secrets the release build is signed with the debug key (fine for testing).
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export VELA_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          fi
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee $RUNNER_TEMP/gradle.log
      - name: Report errors
        if: failure()
        run: |
          ./scripts/ci-report.sh $RUNNER_TEMP/lib.log
          ./scripts/ci-report.sh $RUNNER_TEMP/gradle.log
      - uses: actions/upload-artifact@v4
        with:
          name: Vela-android
          path: android/app/build/outputs/apk/release/*.apk

