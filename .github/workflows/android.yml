name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "android/**"
      - "core/**"
      - "mobile/**"
      - "xrayout/**"
      - "go.mod"
      - "patches/**"
      - "scripts/**"
      - "tools/rules/**"
      - "Makefile"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "core/**"
      - "mobile/**"
      - "xrayout/**"
      - "go.mod"
      - "patches/**"
      - "scripts/**"
      - "tools/rules/**"
      - "Makefile"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: make test

  android:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift \
            /usr/local/lib/android/sdk/ndk /opt/microsoft /opt/google/chrome
          df -h /
      # Pull requests reuse the core library while core/ and the scripts are
      # unchanged; builds of main and tags always rebuild it with fresh rule lists.
      - name: Restore core library (pull requests)
        id: libcache
        if: github.event_name == 'pull_request'
        uses: actions/cache@v4
        with:
          path: android/app/libs/libvela.aar
          key: libvela-${{ hashFiles('core/**', 'mobile/**', 'xrayout/**', 'go.mod', 'patches/**', 'scripts/**') }}
      - uses: actions/setup-go@v5
        if: steps.libcache.outputs.cache-hit != 'true'
        with:
          go-version: "1.26"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - id: ndk
        if: steps.libcache.outputs.cache-hit != 'true'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28
      - name: Build core library
        if: steps.libcache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -o pipefail
          ./scripts/build-mobile-libs.sh android 2>&1 | tee $RUNNER_TEMP/lib.log
          # the Go build cache is not needed any more: room for Gradle
          go clean -cache || true
          df -h /
      - name: Build APKs (full) and App Bundle (play)
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          VELA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VELA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VELA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Without secrets the release build is signed with the test key (fine for testing).
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export VELA_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          fi
          chmod +x gradlew
          set -o pipefail
          # separate runs: APK splits are switched off while a bundle is built
          ./gradlew --no-daemon assembleFullRelease 2>&1 | tee $RUNNER_TEMP/gradle.log
          ./gradlew --no-daemon bundlePlayRelease 2>&1 | tee -a $RUNNER_TEMP/gradle.log
          # Vela-1.4.0-full-arm64-v8a-release.apk -> Vela-1.4.0-arm64-v8a-release.apk
          mkdir -p ../dist
          for f in app/build/outputs/apk/full/release/*.apk; do
            n=$(basename "$f"); cp "$f" "../dist/${n/-full-/-}"
          done
          for f in app/build/outputs/bundle/playRelease/*.aab; do
            n=$(basename "$f" .aab); cp "$f" "../dist/${n%-release}.aab"
          done
          ls -la ../dist
      - name: Report errors
        if: failure()
        run: |
          [ -f $RUNNER_TEMP/lib.log ] && ./scripts/ci-report.sh $RUNNER_TEMP/lib.log
          [ -f $RUNNER_TEMP/gradle.log ] && ./scripts/ci-report.sh $RUNNER_TEMP/gradle.log
          true
      - uses: actions/upload-artifact@v4
        with:
          name: Vela-android
          path: dist/*

      - name: Publish to the "latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create latest --title "Vela (последняя сборка)" --notes "Готовые сборки Vela. Android: файл .apk (Vela-…-play.aab — для Google Play). iPhone: Vela-unsigned.ipa, подпишите своим сертификатом." --prerelease 2>/dev/null || true
          gh release upload latest dist/*.apk dist/*.aab --clobber
