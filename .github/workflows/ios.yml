name: iOS

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "ios/**"
      - "core/**"
      - "mobile/**"
      - "xrayout/**"
      - "go.mod"
      - "patches/**"
      - "scripts/**"
      - "tools/rules/**"
      - "Makefile"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "core/**"
      - "mobile/**"
      - "xrayout/**"
      - "go.mod"
      - "patches/**"
      - "scripts/**"
      - "tools/rules/**"
      - "Makefile"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: make test

  ios:
    runs-on: macos-15
    needs: test
    steps:
      - uses: actions/checkout@v4

      # Pull requests reuse the gomobile frameworks while the Go side is
      # unchanged; builds of main and tags always compile them fresh.
      - name: Restore core frameworks
        if: github.event_name == 'pull_request'
        id: fwcache
        uses: actions/cache/restore@v4
        with:
          path: ios/Frameworks
          key: ios-frameworks-${{ hashFiles('core/**', 'mobile/**', 'xrayout/**', 'go.mod', 'go.sum', 'patches/**', 'scripts/**', 'tools/rules/**') }}

      - uses: actions/setup-go@v5
        if: steps.fwcache.outputs.cache-hit != 'true'
        with:
          go-version: "1.26"

      - name: Build core frameworks
        if: steps.fwcache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          ./scripts/build-mobile-libs.sh ios 2>&1 | tee $RUNNER_TEMP/lib.log

      # saved right away, so a failing app build doesn't lose them
      - name: Save core frameworks
        if: github.event_name == 'pull_request' && steps.fwcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ios/Frameworks
          key: ${{ steps.fwcache.outputs.cache-primary-key }}

      - name: Generate Xcode project
        working-directory: ios
        run: |
          set -o pipefail
          brew install xcodegen
          xcodegen 2>&1 | tee $RUNNER_TEMP/xcodegen.log

      - name: Build app (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Vela.xcodeproj -scheme Vela -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee $RUNNER_TEMP/xcode.log

      # The IPA is ad-hoc signed with its entitlements embedded, so any
      # re-signing tool (Sideloadly, ESign, Feather, Xcode) knows that the app
      # needs the Network Extension (VPN) capability.
      - name: Package IPA
        working-directory: ios
        run: |
          APP=build/Build/Products/Release-iphoneos/Vela.app
          APPEX="$APP/PlugIns/VelaTunnel.appex"
          python3 -c "import plistlib; plistlib.dump({'com.apple.developer.networking.networkextension': ['packet-tunnel-provider'], 'com.apple.security.application-groups': ['group.app.vela.client']}, open('ent-tunnel.plist', 'wb'))"
          cp ent-tunnel.plist ent-app.plist
          codesign -f -s - --entitlements ent-tunnel.plist "$APPEX"
          # home screen widget + Control Center control
          if [ -d "$APP/PlugIns/VelaWidgets.appex" ]; then
            codesign -f -s - --entitlements ent-tunnel.plist "$APP/PlugIns/VelaWidgets.appex"
          fi
          codesign -f -s - --entitlements ent-app.plist "$APP"
          ls "$APP/PlugIns"
          codesign -d --entitlements - "$APPEX"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Vela-unsigned.ipa Payload
          ls -la Vela-unsigned.ipa

      - name: Report errors
        if: failure()
        run: |
          ./scripts/ci-report.sh $RUNNER_TEMP/lib.log
          ./scripts/ci-report.sh $RUNNER_TEMP/xcodegen.log
          # every distinct compiler error, without the long paths
          if [ -f $RUNNER_TEMP/xcode.log ]; then
            grep -E ": (error|fatal error): " $RUNNER_TEMP/xcode.log | sed -E 's#^/[^ ]*/ios/##' | sort -u | head -n 80 > $RUNNER_TEMP/errors.log || true
            if [ -s $RUNNER_TEMP/errors.log ]; then
              ./scripts/ci-report.sh $RUNNER_TEMP/errors.log
            else
              ./scripts/ci-report.sh $RUNNER_TEMP/xcode.log
            fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Vela-iOS-unsigned-ipa
          path: ios/Vela-unsigned.ipa

      - name: Publish to the "latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create latest --title "Vela (последняя сборка)" --notes "Готовые сборки Vela. Android: файл .apk. iPhone: Vela-unsigned.ipa, подпишите своим сертификатом." --prerelease 2>/dev/null || true
          gh release upload latest ios/Vela-unsigned.ipa --clobber
